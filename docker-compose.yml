version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-envsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-envsafe_storage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-envsafe}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # EnvSafe Storage Agent
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-envsafe}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-envsafe_storage}
      AUTH_SECRET: ${AUTH_SECRET}
      PORT: 3001
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
